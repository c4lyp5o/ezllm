# Build and publish the ezllm image to GHCR.
#
# Follows the ezjot/eziarr convention (buildx -> GHCR login -> build-push ->
# ntfy), adapted for Go:
#   * version comes from the git tag, not package.json (Go has no package.json)
#   * ONE platform, linux/amd64. The build is a static CGO-free binary, so a
#     Go cross-compile of arm64 costs nothing — but a *container* cross-build
#     is not free: the whole golang:1.27-alpine + distroless + toolchain
#     runs emulated under QEMU, which was 7 of the 8 minutes of every build.
#     No host in the fleet is arm64 (checked 2026-10-20: calypsocloud-1,
#     Media-Server, GAME-PC and the OVH VPS are all x86_64), so the arm64
#     half of the image had no consumer. arm64 *binaries* are still shipped
#     by release.yml, which cross-compiles them natively in seconds.
#
# Requires: this repo to EXIST on GitHub (it currently has no remote) and a
# `packages: write` permission, granted inline below.
name: Build & Push Docker Image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # A tag must name the version the binary reports (internal/server/version.go
  # serves /healthz). A prerelease suffix (v1.0.0-rc1) is allowed; branch
  # builds pass straight through.
  version:
    runs-on: ubuntu-latest
    steps:
    - name: 🧾 Checkout source
      uses: actions/checkout@v5
    - name: 🏷️ Tag matches version.go
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        want=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/server/version.go)
        tag="${GITHUB_REF_NAME#v}"; tag="${tag%%-*}"
        if [ -z "$want" ] || [ "$tag" != "$want" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match internal/server/version.go ($want)"
          exit 1
        fi

  # The gate: gofmt + go vet + go test + web build must pass before the
  # image build is even attempted (reusable workflow, same file can gate
  # release.yml later).
  test:
    needs: version
    uses: ./.github/workflows/test.yml

  build_and_push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: 🧾 Checkout source
      uses: actions/checkout@v5
      with:
        fetch-depth: 0          # git describe needs history

    - name: 🏷️ Version from git
      id: version
      # tag build -> "v1.3.2"; branch build -> short sha.
      run: |
        V=$(git describe --tags --always 2>/dev/null || echo dev)
        echo "version=$V" >> "$GITHUB_OUTPUT"
        echo "Using version: $V"

    - name: 🏷️ Image tags (latest is MASTER-ONLY)
      id: tags
      # `latest` means "what master is", and nothing else may move it.
      #
      # This used to be an unconditional second line, so EVERY build pushed
      # latest — including a build of an old release tag. Tagging a past commit
      # (a fix-release or a retroactive tag) therefore rewrote latest to that
      # older image, and the next deploy pulled 1.3.1 content while master was
      # 1.3.2. Caught live on 2026-10-27: after pushing the retroactive v1.3.1
      # tag, `docker pull ...:latest` reported revision c9b1601 while master was
      # 06bc0e3 — the container would have gone backwards on the next recreate.
      #
      # A tag build now publishes only its own version tag; the version tag is
      # what a rollback or a pinned deploy should pull anyway.
      run: |
        OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        {
          echo "list<<EOF"
          echo "ghcr.io/$OWNER/ezllm:${{ steps.version.outputs.version }}"
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "ghcr.io/$OWNER/ezllm:latest"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        echo "tags for ${{ github.ref }}:"
        grep -E '^ghcr' "$GITHUB_OUTPUT"

    - name: 🐳 Setup Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: 🐳 Docker Login (GHCR)
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🛠️ Build & Push Docker Image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        # amd64 + arm64 without emulation: the Dockerfile's builder runs on
        # the runner's platform and cross-compiles (GOARCH=$TARGETARCH), and
        # the runtime stage only copies — an emulated build once cost 7 of
        # the 8 minutes of every push.
        platforms: linux/amd64,linux/arm64
        # GHA layer cache. mode=max is what exports the BUILDER stage, which
        # is where the Go module download and the compile live — mode=min
        # would only cache the final image layers and save us nothing.
        # ignore-error matters: a cache export can fail with "failed to
        # reserve cache" AFTER the image is built and pushed, and the worst
        # case we want is a cold cache, never a red build.
        cache-from: type=gha
        cache-to: type=gha,mode=max,ignore-error=true
        # ghcr requires lowercase; the owner is already lowercase but this
        # guards against a future uppercase org name.
        tags: ${{ steps.tags.outputs.list }}
        labels: |
          org.opencontainers.image.title=ezllm
          org.opencontainers.image.description=OpenAI/Anthropic-compatible LLM router with a request ledger
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

    - name: 🔔 Notify ntfy
      if: always()
      env:
        NTFY_URL: ${{ secrets.NTFY_URL }}
      run: |
        if [ -n "$NTFY_URL" ]; then
          curl \
            -H "Title: Build ${{ job.status }}: ezllm:${{ steps.version.outputs.version }}" \
            -H "Priority: ${{ job.status == 'success' && 'default' || 'high' }}" \
            -H "Tags: ${{ job.status == 'success' && 'white_check_mark' || 'x' }},rocket" \
            -d "Branch: ${{ github.ref_name }} | Status: ${{ job.status }}" \
            "$NTFY_URL"
        fi
