# Build and publish the ezllm image to GHCR.
#
# Follows the ezjot/eziarr convention (buildx -> GHCR login -> build-push ->
# ntfy), adapted for Go:
#   * version comes from the git tag, not package.json (Go has no package.json)
#   * ONE platform, linux/amd64. The build is a static CGO-free binary, so a
#     Go cross-compile of arm64 costs nothing — but a *container* cross-build
#     is not free: the whole golang:1.27-alpine + distroless + toolchain
#     runs emulated under QEMU, which was 7 of the 8 minutes of every build.
#     No host in the fleet is arm64 (checked 2026-10-20: calypsocloud-1,
#     Media-Server, GAME-PC and the OVH VPS are all x86_64), so the arm64
#     half of the image had no consumer. arm64 *binaries* are still shipped
#     by release.yml, which cross-compiles them natively in seconds.
#
# Requires: this repo to EXIST on GitHub (it currently has no remote) and a
# `packages: write` permission, granted inline below.
name: Build & Push Docker Image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # The gate: gofmt + go vet + go test + web build must pass before the
  # image build is even attempted (reusable workflow, same file can gate
  # release.yml later).
  test:
    uses: ./.github/workflows/test.yml

  build_and_push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: 🧾 Checkout source
      uses: actions/checkout@v5
      with:
        fetch-depth: 0          # git describe needs history

    - name: 🏷️ Version from git
      id: version
      # tag build -> "1.2.3"; branch build -> short sha. Both give `latest`.
      run: |
        V=$(git describe --tags --always 2>/dev/null || echo dev)
        echo "version=$V" >> "$GITHUB_OUTPUT"
        echo "Using version: $V"

    - name: 🐳 Setup Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: 🐳 Docker Login (GHCR)
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🛠️ Build & Push Docker Image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        # One platform: no host in the fleet is arm64, and an emulated
        # cross-build cost 7 of the 8 minutes of every push. arm64 binaries
        # are still shipped by release.yml (native Go cross-compile).
        platforms: linux/amd64
        # GHA layer cache. mode=max is what exports the BUILDER stage, which
        # is where the Go module download and the compile live — mode=min
        # would only cache the final image layers and save us nothing.
        # ignore-error matters: a cache export can fail with "failed to
        # reserve cache" AFTER the image is built and pushed, and the worst
        # case we want is a cold cache, never a red build.
        cache-from: type=gha
        cache-to: type=gha,mode=max,ignore-error=true
        # ghcr requires lowercase; the owner is already lowercase but this
        # guards against a future uppercase org name.
        tags: |
          ghcr.io/${{ github.repository_owner }}/ezllm:${{ steps.version.outputs.version }}
          ghcr.io/${{ github.repository_owner }}/ezllm:latest
        labels: |
          org.opencontainers.image.title=ezllm
          org.opencontainers.image.description=OpenAI/Anthropic-compatible LLM router with a request ledger
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

    - name: 🔔 Notify ntfy
      if: always()
      env:
        NTFY_URL: ${{ secrets.NTFY_URL }}
      run: |
        if [ -n "$NTFY_URL" ]; then
          curl \
            -H "Title: Build ${{ job.status }}: ezllm:${{ steps.version.outputs.version }}" \
            -H "Priority: ${{ job.status == 'success' && 'default' || 'high' }}" \
            -H "Tags: ${{ job.status == 'success' && 'white_check_mark' || 'x' }},rocket" \
            -d "Branch: ${{ github.ref_name }} | Status: ${{ job.status }}" \
            "$NTFY_URL"
        fi
