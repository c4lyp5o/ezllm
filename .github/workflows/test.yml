# ez standard test workflow: lint, tests and build, plus the Docker image built,
# booted and serving. Runs on PRs; pushes to development and master, and tags, run
# it through publish.yml, before anything is published.
#
# GOMEMLIMIT/GOGC: the internal/server suite churned past 4 GB when run unbounded.
# Its live set is small, so a soft GC ceiling keeps the runner inside budget. The
# web step compares the committed bundle with a fresh build, normalizing only
# Vite's checkout-dependent asset hash suffixes.
name: test

on:
  pull_request:
    branches: [development, master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v7

      - name: 🟢 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod   # stays in lockstep with the project
          cache: true

      - name: 🧹 gofmt
        run: |
          UNFORMATTED=$(gofmt -l cmd internal)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::gofmt needed on: $UNFORMATTED"
            exit 1
          fi

      - name: 🩺 go vet
        run: go vet ./...

      - name: Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: 🧪 go test
        env:
          GOMEMLIMIT: 3GiB
          GOGC: "50"
        run: go test -count=1 -timeout 15m ./...

      - name: 🍎 macOS installer
        run: python3 -m unittest scripts/ezllm_mac_test.py

      - name: 🔄 Bridge updater
        run: python3 -m unittest scripts/bridge_update_test.py

      # Every release target (scripts/release-assets.sh) must compile, so an
      # OS-specific API breaks the gate, not the release job after a tag (v1.0.0's
      # first run failed on windows: syscall.Setpgid).
      - name: 🧩 Cross-build release targets
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "--- $t"
            CGO_ENABLED=0 GOOS="${t%/*}" GOARCH="${t#*/}" go build -o /dev/null ./cmd/ezllm
          done

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 🌐 Web type-check + build
        working-directory: web
        run: |
          npm ci
          npm run build -- --emptyOutDir --outDir "$RUNNER_TEMP/ezllm-web-dist"  # tsc + Vite
          node tests/check-dist.test.mjs
          node tests/logic.test.mjs
          node scripts/check-dist.mjs dist "$RUNNER_TEMP/ezllm-web-dist"

      - name: Dashboard browser regressions
        working-directory: web
        timeout-minutes: 10
        run: |
          npx playwright install --with-deps chromium
          node tests/verify-frontend-p1.mjs
          node tests/verify-frontend-p2.mjs
          node tests/verify-frontend-p3.mjs
          node tests/verify-update.mjs
          node tests/verify-qol-pass.mjs
          node tests/verify-settings.mjs
          node tests/verify-first-run.mjs
          SHOT="$RUNNER_TEMP/bridges.png" node tests/verify-bridges.mjs

  docker:
    name: Docker image (build, boot, healthy)
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v7
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🛠️ Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ezllm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - name: 🔬 Boot and wait for healthz
        run: |
          set -euo pipefail
          want=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/server/version.go)
          mkdir -p "$RUNNER_TEMP/data" && chmod 777 "$RUNNER_TEMP/data"
          docker run -d --name app --user 1000:1000 -p 127.0.0.1:20129:20129 \
            -v "$PWD/config.example.yaml:/app/config.yaml:ro" -v "$RUNNER_TEMP/data:/data" ezllm:ci
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] || { echo "::error::container exited"; exit 1; }
            body=$(curl -fsS http://127.0.0.1:20129/healthz 2>/dev/null || true)
            [ -n "$body" ] && break
            sleep 1
          done
          echo "$body"
          test "$(echo "$body" | jq -r '.status + " " + .version')" = "ok $want"
      - name: 🧾 Container logs
        if: always()
        run: docker logs app || true
