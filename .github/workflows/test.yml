# Test gate — run BEFORE anything publishes.
#
# docker-publish.yml calls this workflow and its build_and_push job says
# `needs: test`, so a red suite never produces an image (this is the gate
# Calypso asked for on 2026-10-16: "let CI do the testing before pushing").
# It is reusable (`workflow_call`): docker-publish.yml AND release.yml both
# call it, so a red suite never produces an image OR a release asset.
#
# Two honest notes:
#   * GOMEMLIMIT/GOGC: the internal/server suite churned past 4GB when run
#     unbounded locally and got OOM-killed (dmesg: server.test anon-rss
#     4.17GB). Its live set is small — it passes at a 1GiB limit — so a soft
#     GC ceiling keeps the runner inside budget without altering behaviour.
#   * The web step proves the sources type-check and build; it does NOT
#     assert the committed dist reproduces byte-for-byte, because Vite's
#     output hash depends on the absolute checkout path and would differ on
#     every machine. Freshness of the committed bundle stays a local
#     repo-path rebuild before commit.
#
#     NOTE (2026-10-20): the checkout-path caveat above is now only true of
#     the JS bundle name. The CSS no longer depends on the previous build:
#     web/src/index.css carries `@source not "../dist"`, because Tailwind
#     otherwise scans the tracked web/dist/ output and feeds the previous
#     build's class names into the next one. With that exclusion the CSS
#     hash is a function of the sources alone and reproduces across paths.
name: Tests

on:
  workflow_call:
  workflow_dispatch:
  # A PR gets the same gate as a release. Without this the reusable workflow only
  # ever ran when docker-publish.yml or release.yml called it, so a branch could
  # open a PR, be reviewed and merged with NO test result anywhere — "no checks
  # reported" reads like a green light to anyone skimming the PR.
  #
  # No duplication: this workflow has no `push` trigger, so the merge commit is
  # still tested exactly once, by the publish/release caller or by the next PR.
  # `edited` is deliberately absent (it fires on a title change and would re-run
  # the whole suite for nothing); `synchronize`/`reopened` are the defaults that
  # matter.
  pull_request:
    branches:
      - development
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v5

      - name: 🟢 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod   # stays in lockstep with the project
          cache: true

      - name: 🧹 gofmt
        run: |
          UNFORMATTED=$(gofmt -l cmd internal)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::gofmt needed on: $UNFORMATTED"
            exit 1
          fi

      - name: 🩺 go vet
        run: go vet ./...

      - name: 🧪 go test
        env:
          GOMEMLIMIT: 3GiB
          GOGC: "50"
        run: go test -count=1 -timeout 15m ./...

      # Every release.yml target must compile, so an OS-specific API breaks
      # the gate on master, not the release job after a tag (v1.0.0's first
      # run failed on windows: syscall.Setpgid).
      - name: 🧩 Cross-build release targets
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "--- $t"
            CGO_ENABLED=0 GOOS="${t%/*}" GOARCH="${t#*/}" go build -o /dev/null ./cmd/ezllm
          done

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 🌐 Web type-check + build
        working-directory: web
        run: |
          npm ci
          npm run build   # tsc --noEmit && vite build
