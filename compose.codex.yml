# ChatGPT subscription overlay: turns the codex bridge on and mounts what it
# needs — docs/codex-bridge-runbook.md.
#
#   docker compose -f compose.yml -f compose.traefik.yml -f compose.codex.yml up -d
#
# Base compose.yml keeps the bridge off and mounts nothing, so a host without
# the Codex CLI never gets empty directories where the mounts would be (a bind
# mount whose source is missing makes Docker create one).
#
# The release directory is a pinned copy of the whole Codex CLI release
# (outside ~/.codex/packages, which the updater manages; bin/ holds the CLI and
# the code-mode host client tools need), read-only. The login is read-write:
# the CLI refreshes its token and keeps state there.

services:
  ezllm:
    environment:
      EZLLM_CODEX_BRIDGE: "on"
    volumes:
      - ${CODEX_CLI_DIR:-/home/calypso/.local/share/codex-bridge/0.163.0}:/opt/codex:ro
      - ${CODEX_SUB_DIR:-/home/calypso/.codex-sub}:/codex-sub
