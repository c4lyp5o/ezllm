# Home-box overlay: puts ezllm behind the shared traefik (traefik_default).
#
#   EZLLM_HOST=llm.calypso.dedyn.io \
#     docker compose -f compose.yml -f compose.traefik.yml up -d
#
# Base compose.yml stays portable (build + 20129 on the host). This overlay only
# adds the external network, the traefik labels, and the /admin guard — so the
# public hostname lives in the deployment invocation, not in the portable file.
#
# TLS is global: the traefik `websecure` entrypoint already sets
# certResolver=leresolver, so NO tls/certresolver labels belong here (adding them
# is redundant, and `tls: true` on the router breaks the ACME defaults).
#
# Three routers, deliberately:
#   * ezllm-login  — the sign-in endpoint alone, behind a deliberately tight
#     per-source rate limit (a brute-force budget, not a nicety).
#   * ezllm-admin  — /admin/* is the CONTROL PLANE (dashboard password, provider
#     keys, client tokens). It is public: the operator needs it from anywhere,
#     and the dashboard password is no longer the documented default. No MFA
#     exists, so the password must stay long and unique.
#   * ezllm        — /v1/* + the SPA, public. Every inference call still needs a
#     client token, and /healthz is intentionally public.
services:
  ezllm:
    networks:
      - traefik_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"

      # public surface: /v1, /healthz, the dashboard shell
      - "traefik.http.routers.ezllm.rule=Host(`${EZLLM_HOST:-llm.calypso.dedyn.io}`)"
      - "traefik.http.routers.ezllm.entrypoints=websecure"
      - "traefik.http.routers.ezllm.middlewares=enhanced-security@file"
      - "traefik.http.services.ezllm.loadbalancer.server.port=20129"

      # control plane: public, guarded by the dashboard password + a per-source
      # rate limit. Priorities are explicit because the default (longer rule
      # string wins) is a trap here: PathPrefix(`/admin`) is ONE character longer
      # than Path(`/admin/login`), so without a priority the sign-in endpoint
      # silently rides the dashboard's loose limiter instead of its own.
      - "traefik.http.routers.ezllm-admin.rule=Host(`${EZLLM_HOST:-llm.calypso.dedyn.io}`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.ezllm-admin.entrypoints=websecure"
      - "traefik.http.routers.ezllm-admin.priority=100"
      - "traefik.http.routers.ezllm-admin.middlewares=ezllm-admin-limit@file,enhanced-security@file"
      - "traefik.http.routers.ezllm-admin.service=ezllm"

      # the sign-in endpoint gets a tighter budget than the dashboard it opens
      - "traefik.http.routers.ezllm-login.rule=Host(`${EZLLM_HOST:-llm.calypso.dedyn.io}`) && Path(`/admin/login`)"
      - "traefik.http.routers.ezllm-login.entrypoints=websecure"
      - "traefik.http.routers.ezllm-login.priority=200"
      - "traefik.http.routers.ezllm-login.middlewares=ezllm-login-limit@file,enhanced-security@file"
      - "traefik.http.routers.ezllm-login.service=ezllm"

networks:
  traefik_default:
    external: true
