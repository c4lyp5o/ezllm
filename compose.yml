# Run ezllm in Docker.
#
#   cp config.example.yaml config.yaml
#   docker compose up -d
#
# Both paths work: `build: .` compiles from source, or drop it and use
# `image:` to pull the published GHCR build.
services:
  ezllm:
    image: ghcr.io/c4lyp5o/ezllm:latest
    build: .
    container_name: ezllm
    restart: unless-stopped

    # Run the service as the current user for private DB ownership; secrets live only in SQLite.
    user: "${UID:-1000}:${GID:-1000}"

    ports:
      # host port is overridable so a second instance (staging, a test) does
      # not have to edit this file:  EZLLM_PORT=20130 docker compose up -d
      - "${EZLLM_PORT:-20129}:20129"

    environment:
      TZ: Asia/Kuala_Lumpur
      # Default zone for group_by=day bucketing, so the dashboard's day view
      # agrees with a usage rule's day (both use store.CountBucket). A tz that
      # will not load is a BOOT error, never a silent UTC shift. Per-request
      # ?tz= overrides this; see docs/API.md under GET /admin/usage.
      EZLLM_USAGE_TZ: ${EZLLM_USAGE_TZ:-Asia/Kuala_Lumpur}
      # Master key for at-rest provider-key encryption. Default lives on the
      # data volume so it is backed up with the DB; override with an absolute
      # path or set EZLLM_MASTER_KEY directly. Losing it loses every provider key.
      EZLLM_MASTER_KEY_FILE: ${EZLLM_MASTER_KEY_FILE:-/data/ezllm-master.key}
      # First dashboard password. Without it, first boot prints a one-time
      # setup code (`docker logs ezllm`) that the dashboard asks for. Used only
      # while setup is pending; it never overwrites a password already set.
      # EZLLM_DASHBOARD_PASSWORD_FILE: /data/ezllm-dashboard-password

      # Claude subscription surface (loopback-only, an ordinary
      # anthropic-compatible account dials it). Needs the two mounts below; set
      # EZLLM_CLAUDE_BRIDGE=off on a host without a Claude Code CLI + login.
      EZLLM_CLAUDE_BRIDGE: ${EZLLM_CLAUDE_BRIDGE:-on}
      EZLLM_CLAUDE_BIN: /opt/claude/claude
      EZLLM_CLAUDE_CONFIG_DIR: /claude-sub
      # The CLI's local login check reads process identity: without these two it
      # reports logged-out instantly and every subscription request fails. They
      # must name the owner of the mounted login directory.
      USER: ${CLAUDE_BRIDGE_USER:-calypso}
      LOGNAME: ${CLAUDE_BRIDGE_USER:-calypso}

    # All credentials are dashboard-managed and persisted in the SQLite volume.

    volumes:
      # Non-secret provider metadata; credentials stay in SQLite.
      - ./config.yaml:/app/config.yaml:ro
      # The ledger. Without this, every restart loses all token accounting.
      # Overridable because ./data IS your live ledger when run from the repo
      # root — pointing a staging instance at it would open prod's SQLite from
      # a second process:  EZLLM_DATA=./data-staging docker compose up -d
      - "${EZLLM_DATA:-./data}:/data"

      # Claude subscription surface: the official CLI binary (pinned by this
      # path — a CLI upgrade means re-pointing it and re-running the live proof)
      # and the subscription login. The CLI mount is read-only; the login is
      # read-write because the CLI refreshes its own token there. The account's
      # shared secret auto-generates into /data on first boot, so it is backed up
      # with the ledger.
      - ${CLAUDE_CLI_BIN:-/home/calypso/.local/share/claude/versions/2.1.299}:/opt/claude/claude:ro
      - ${CLAUDE_SUB_DIR:-/home/calypso/.claude-sub}:/claude-sub

# Optional: front the dashboard with traefik (uncomment and adjust the host).
#   networks: { traefik_default: { external: true } }
#   labels:
#     - "traefik.enable=true"
#     - "traefik.http.routers.ezllm.rule=Host(`${EZLLM_HOST:-llm.example.com}`)"
#     - "traefik.http.services.ezllm.loadbalancer.server.port=20129"
