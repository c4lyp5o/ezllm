# ezllm — non-secret provider metadata. All credentials are managed in SQLite.

listen: "127.0.0.1:20129"     # loopback by default; override with -addr for LAN
data_dir: ./data               # repo-relative so Docker can bind-mount ./data

max_body_mib: 32
# upstream_timeout: 0 = unbounded (streaming responses have no natural deadline)

providers:
  # ── OpenCode Go ────────────────────────────────────────────────────────────
  # Clients address it as "<namespace>/<model>", e.g. opengo/qwen3.8-flash.
  # REQUIRES x-opencode-session (defaults on for kind: opencode-go); a missing
  # header yields 400 MissingSessionID upstream. Serves all three surfaces, but
  # per-model: /v1/messages 400s ModelProtocolUnsupported on some models
  # (glm-5.2, omen-alpha, kimi-k2.6) while qwen/deepseek/minimax work.
  opencode-main:
    namespace: opengo
    kind: opencode-go
    base_url: https://opencode.ai/zen/go/v1
    # Add keys through Providers → Add provider in the dashboard.

  # ── Generic OpenAI-compatible (ssn-gpt = space.stationine.com) ─────────────
  # Its GET /v1/usage reports a MONEY shape (balance/remaining in USD plus
  # usage.today / usage.total cost), which the dashboard renders as a balance
  # card rather than percentage bars.
  ssn-gpt:
    namespace: super-ssn
    kind: openai-compatible
    base_url: https://space.stationine.com/v1
    # Add keys through Providers → Add provider in the dashboard.
    # This host sits behind Cloudflare: probing too fast returns 403 "error
    # code: 1010", which would make the key test FAIL ON A PERFECTLY GOOD KEY.
    # Keep probe_delay_ms >= 400.
    probe_delay_ms: 500

  # ── Anthropic-compatible (x-api-key + anthropic-version, not Bearer) ───────
  # anthropic-main:
  #   namespace: anth
  #   kind: anthropic-compatible
  #   base_url: https://api.anthropic.com     # host only — /v1 is appended automatically
  #   # Add the account and key through the dashboard.

ledger:
  batch_size: 32
  batch_wait: 250ms

# Hop parking after a failure. A parked hop is skipped and given one half-open
# probe when the window elapses.
#
# on_429: how long to park a hop that answered 429 — but ONLY when the combo has
#   another hop to fall over to. With a single candidate, parking would convert
#   the provider's own window (TokenRouter allows 5 requests per MINUTE) into a
#   much longer outage of our making, so a sole hop is left available and the
#   request is attempted for real.
#   An upstream Retry-After header always wins over this when present, so a
#   provider that states its own reset time is believed over our configured one.
# on_5xx: how long to park a hop that is genuinely broken.
# max_per_key: NOT IMPLEMENTED — parsed and validated but read by no code.
#   (Remove it, or tell me what it should mean and I will wire it.)
cooldown:
  on_429: 300s
  on_5xx: 60s
  max_per_key: 3

# Global upstream retries per combo hop: 3 retries after the initial attempt.
retry:
  retries: 3

# Refresh each provider's model catalog at startup and on this interval.
model_refresh:
  interval: 6h
