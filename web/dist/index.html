    <script>
      // Theme bootstrap, deliberately inline and non-module: it must run before
      // first paint, and a module script is deferred until after the document
      // is parsed — which is exactly the flash this prevents.
      //

      //
      // No prefers-color-scheme branch, on purpose. The first version had one,
      // and it made the default depend on the OS: every headless/CI browser
      // and any machine left on light produced a light first paint, which is
      // not the default the operator asked for. A dashboard that silently
      // re-themes because the laptop's sunset timer fired is also worse than
      // one that never did. Stored choice, or dark. That is all.
      (function () {
        try {
          var t = localStorage.getItem('ezllm.theme') === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', t === 'dark');
          root.classList.toggle('light', t === 'light');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', t === 'dark' ? '#0a0a0b' : '#f6f7f9');
        } catch (e) {
          /* storage blocked or an exotic engine: class="dark" is already on
             <html> and `color-scheme: dark` is already the default, so the
             correct state is in effect with nothing to undo. */
        }
